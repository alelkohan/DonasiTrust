<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
    <defs>
        <!-- Background Gradients -->
        <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#19152b"/>
            <stop offset="50%" stop-color="#12101c"/>
            <stop offset="100%" stop-color="#0a0814"/>
        </linearGradient>

        <radialGradient id="neon-glow" cx="50%" cy="38%" r="65%">
            <stop offset="0%" stop-color="#99ff04" stop-opacity="0.16"/>
            <stop offset="50%" stop-color="#99ff04" stop-opacity="0.03"/>
            <stop offset="100%" stop-color="#99ff04" stop-opacity="0"/>
        </radialGradient>

        <linearGradient id="plate-border" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
        </linearGradient>

        <linearGradient id="icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#99ff04"/>
            <stop offset="100%" stop-color="#76cc00"/>
        </linearGradient>

        <!-- Subtle Dot Grid Pattern -->
        <pattern id="dot-pattern" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
            <circle cx="3" cy="3" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
        </pattern>
    </defs>

    <!-- Background Base -->
    <rect width="800" height="450" fill="url(#bg-grad)"/>
    <rect width="800" height="450" fill="url(#dot-pattern)"/>
    <rect width="800" height="450" fill="url(#neon-glow)"/>

    <!-- Central Content Group -->
    <g transform="translate(400, 225)">
        <!-- Icon Badge Container -->
        <rect x="-56" y="-140" width="112" height="112" rx="30" fill="#1b182a" stroke="url(#plate-border)" stroke-width="2"/>
        <rect x="-56" y="-140" width="112" height="112" rx="30" fill="#99ff04" fill-opacity="0.06"/>

        <!-- Camera / Landscape Icon -->
        <g transform="translate(-32, -116)">
            <!-- Outer Frame -->
            <rect x="3" y="6" width="58" height="44" rx="10" stroke="url(#icon-grad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- Sun / Moon Circle -->
            <circle cx="18" cy="20" r="4.5" fill="url(#icon-grad)"/>
            <!-- Mountain / Wave Path -->
            <path d="M8 42L24 25L37 38L45 30L55 42" stroke="url(#icon-grad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <!-- Main Heading Text -->
        <text x="0" y="10" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="0.5">
            Belum Ada Sampul
        </text>

        <!-- Subtitle Text -->
        <text x="0" y="44" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="0.2">
            Foto sampul belum diunggah untuk kampanye ini
        </text>

        <!-- Brand Pill Tag -->
        <g transform="translate(0, 92)">
            <rect x="-78" y="-17" width="156" height="34" rx="17" fill="#1b182a" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.2"/>
            <circle cx="-54" cy="0" r="4" fill="#99ff04"/>
            <text x="-40" y="5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" letter-spacing="0.4">
                DonasiTrust
            </text>
        </g>
    </g>
</svg>
